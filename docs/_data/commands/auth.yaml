title: Autenticação
sections:
  -
    commands:
      - 'auth login'
    status: verified
    body: |
      Sem parâmetros. Imprime uma URL, sobe um listener HTTPS local na porta **9876** e aguarda o redirect. Na primeira vez emite o certificado em `~/.config/conta-azul-cli/certs/` e instala a CA no trust store do usuário. Tokens vão para `~/.config/conta-azul-cli/tokens.json` com permissão `0600`.

      O refresh é automático e invisível — não existe comando para isso. Renovação preventiva a menos de 60 s da expiração, e reativa uma vez em caso de `401`.
  -
    commands:
      - 'auth logout'
    status: verified
    body: |
      Sem parâmetros. Remove as credenciais locais.
