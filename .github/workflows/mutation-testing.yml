name: Mutation Testing

# Manual only: mutation testing re-runs the suite once per mutant, which
# doesn't scale to "on every push" the way the other checks do. Run it
# on demand from the Actions tab when you want a fresh MSI reading.
on:
  workflow_dispatch:

# Somente leitura: nenhum destes jobs escreve no repositório.
# Explícito em vez de herdar o default do repo, que é uma
# configuração que pode mudar sem ninguém revisar os workflows.
permissions:
  contents: read

jobs:
  infection:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, openssl, posix
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Visibility only, no gate (no --min-msi): Command/Auth/LoginCommand.php
      # is known-uncovered by design (see CONTRIBUTING.md), so a threshold
      # would need to account for that first.
      - name: Run Infection
        run: vendor/bin/infection --threads=max --no-progress --logger-github
