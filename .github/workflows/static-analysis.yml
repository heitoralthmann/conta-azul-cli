name: Static Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Somente leitura: nenhum destes jobs escreve no repositório.
# Explícito em vez de herdar o default do repo, que é uma
# configuração que pode mudar sem ninguém revisar os workflows.
permissions:
  contents: read

jobs:
  phpstan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, openssl, posix
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # PHPStan exceeds PHP's default 128 MB limit on this codebase.
      - name: Run PHPStan (src, level max)
        run: vendor/bin/phpstan analyse src/ --level=max --no-progress --memory-limit=1G

      - name: Run PHPStan (tests, level 6)
        run: vendor/bin/phpstan analyse tests/ --level=6 --no-progress --memory-limit=1G

      - name: Check for unused and shadow dependencies
        run: vendor/bin/composer-dependency-analyser
