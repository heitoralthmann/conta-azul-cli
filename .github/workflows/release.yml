name: Release PHAR

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, posix
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Install Box
        run: composer global require humbug/box --no-interaction

      - name: Build PHAR
        run: ~/.composer/vendor/bin/box compile

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: conta-azul-cli.phar
