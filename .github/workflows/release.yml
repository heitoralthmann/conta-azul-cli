name: Release PHAR

on:
  push:
    tags:
      - 'v*'

# Escrita é necessária: o job anexa o PHAR e o checksum à release da tag.
permissions:
  contents: write

jobs:
  # A tag dispara este workflow independentemente dos demais, então sem estes
  # `needs` um `git push --tags` publica o artefato enquanto os testes ainda
  # rodam — ou depois de falharem. Foi o que aconteceu na v0.17.0: a release
  # saiu verde enquanto o job de testes ficava vermelho no Windows.
  #
  # Reuso em vez de cópia: os mesmos arquivos que guardam a `main` guardam a
  # tag, e não há um segundo conjunto de checagens para manter em sincronia.
  # `docs.yml` fica de fora de propósito — ele publica no GitHub Pages, e
  # rodá-lo a partir de uma tag tentaria um deploy que não é papel da release.
  # Os checks acima provam que o código da tag é *bom*; nenhum deles prova que
  # é o código que passou por main. Tag vive em `refs/tags/*`, e nenhuma regra
  # de proteção de branch alcança esse namespace: um `git tag` em qualquer
  # commit local, seguido de `git push origin <tag>`, dispara esta release sem
  # nunca tocar em main. Este job é o que fecha isso — e mora aqui, versionado
  # e revisável, em vez de numa configuração que alguém desliga sem deixar
  # rastro no repositório.
  provenance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # O default é profundidade 1: sem o histórico não há como responder
          # se este commit descende de main.
          fetch-depth: 0

      - name: A tag precisa apontar para um commit contido em main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Commit $GITHUB_SHA está contido em main."
            exit 0
          fi
          echo "::error title=Tag fora de main::O commit $GITHUB_SHA não é alcançável a partir de main. Publicar a partir dele entregaria código que nunca passou pelo histórico revisado."
          exit 1

  tests:
    needs: provenance
    uses: ./.github/workflows/tests.yml

  static-analysis:
    needs: provenance
    uses: ./.github/workflows/static-analysis.yml

  code-style:
    needs: provenance
    uses: ./.github/workflows/code-style.yml

  security:
    needs: provenance
    uses: ./.github/workflows/security.yml

  build:
    needs: [provenance, tests, static-analysis, code-style, security]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, openssl, posix
          coverage: none

      # Versão fixa + SHA-256 conferido, o mesmo script que roda na máquina local.
      # O caminho antigo (`composer global require humbug/box`) instalava a versão
      # que estivesse no ar naquele dia, num diretório que já nem existia mais.
      - name: Install Box
        run: tools/install-box.sh

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --classmap-authoritative --optimize-autoloader

      # phar.readonly vem On na maioria dos php.ini; sem isso o compile falha.
      - name: Build PHAR
        run: php -d phar.readonly=0 build/box.phar compile

      # O passo que faltava. Sem ele, 16 artefatos quebrados foram publicados sem
      # que nada no CI reclamasse: nenhum teste do projeto executa o binário empacotado.
      - name: Smoke test the PHAR
        run: tools/smoke-test.sh build/conta-azul-cli.phar

      - name: Generate checksum
        working-directory: build
        run: sha256sum conta-azul-cli.phar > conta-azul-cli.phar.sha256

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            build/conta-azul-cli.phar
            build/conta-azul-cli.phar.sha256
