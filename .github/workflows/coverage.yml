name: Coverage

on:
  pull_request:
    branches: [main]

# Somente leitura: nenhum destes jobs escreve no repositório.
# Explícito em vez de herdar o default do repo, que é uma
# configuração que pode mudar sem ninguém revisar os workflows.
permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, openssl, posix
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Visibility only, no gate: the goal is to make the gap between src/Api
      # and src/Command visible, not to fail the build on a threshold.
      - name: Run tests with coverage
        run: vendor/bin/phpunit --coverage-text --colors=never | tee "$GITHUB_STEP_SUMMARY"
