name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default; the two jobs that need more declare it themselves.
permissions:
  contents: read

# Allow one deploy at a time, and let a newer commit supersede a queued one
# instead of publishing an older site after it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Proves the committed reference still matches the CLI. This is the guard
  # that makes the generated half of the documentation trustworthy: a renamed
  # option or an undocumented command fails here rather than shipping.
  check:
    name: Reference is in sync
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, openssl, posix
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Check generated documentation
        run: composer docs:check

  build:
    name: Build site
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      # --strict turns broken internal links and nav warnings into failures.
      - name: Build
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  # GitHub Pages has to be turned on by hand once, in Settings -> Pages, and on
  # the Free plan that is only offered for public repositories. Until then the
  # deploy API answers 404, and letting that fail the run would paint every
  # push red for a reason that has nothing to do with the code — which is how
  # people learn to ignore CI. So the deploy is skipped while Pages is absent,
  # and still fails loudly once it exists.
  pages-enabled:
    name: Pages configured?
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      pages: read

    outputs:
      enabled: ${{ steps.check.outputs.enabled }}

    steps:
      - name: Query the Pages API
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if response=$(gh api "repos/$REPO/pages" 2>&1); then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only a missing site is an expected answer. Anything else — a
          # permissions problem, an outage — must not masquerade as "not
          # configured yet", or a real deploy would be skipped in silence.
          if grep -q 'Not Found' <<< "$response"; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy pulado::GitHub Pages ainda não foi habilitado para $REPO. O site foi construído e validado, mas não publicado. Habilite em Settings -> Pages com Source: GitHub Actions (requer repositório público no plano Free)."
            exit 0
          fi

          echo "$response" >&2
          exit 1

  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    needs: [build, pages-enabled]
    if: needs.pages-enabled.outputs.enabled == 'true'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
