name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # posix is deliberately absent: it does not exist on Windows, and the
          # CLI guards every call to it.
          extensions: mbstring, openssl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run tests
        run: vendor/bin/phpunit --no-coverage

      # composer.json/lock and advisory checks don't vary by runner, so one is enough.
      - name: Validate composer.json and composer.lock
        if: matrix.os == 'ubuntu-latest' && matrix.php == '8.3'
        run: composer validate --strict

      - name: Audit dependencies for known vulnerabilities
        if: matrix.os == 'ubuntu-latest' && matrix.php == '8.3'
        run: composer audit

      # Static analysis and style don't vary by runner, so one is enough.
      - name: Run PHPStan
        if: matrix.os == 'ubuntu-latest' && matrix.php == '8.3'
        run: vendor/bin/phpstan analyse src/ --level=max --no-progress

      # composer lint also covers bin/ca (piped through STDIN, see composer.json),
      # which a direct phpcs invocation would silently skip.
      - name: Check code style
        if: matrix.os == 'ubuntu-latest' && matrix.php == '8.3'
        run: composer lint

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, posix
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Visibility only, no gate: the goal is to make the gap between src/Api
      # and src/Command visible, not to fail the build on a threshold.
      - name: Run tests with coverage
        run: vendor/bin/phpunit --coverage-text --colors=never | tee "$GITHUB_STEP_SUMMARY"
