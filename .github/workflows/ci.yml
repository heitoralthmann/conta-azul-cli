name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # posix is deliberately absent: it does not exist on Windows, and the
          # CLI guards every call to it.
          extensions: mbstring, openssl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run tests
        run: vendor/bin/phpunit --no-coverage

      # Static analysis and style are platform-independent, so one runner is enough.
      - name: Run PHPStan
        if: matrix.os == 'ubuntu-latest'
        run: vendor/bin/phpstan analyse src/ --level=max --no-progress

      - name: Check code style
        if: matrix.os == 'ubuntu-latest'
        run: vendor/bin/pint --test
