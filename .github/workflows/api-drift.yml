name: Check API Drift

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 9am UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest OpenAPI spec
        id: check
        run: |
          # TODO: Update SPEC_URL when Conta Azul publishes the OpenAPI spec URL
          # SPEC_URL="https://developers.contaazul.com/financial-apis-openapi.yaml"
          # curl -sSf "$SPEC_URL" -o /tmp/latest-spec.yaml 2>/dev/null || true
          # if [ -f /tmp/latest-spec.yaml ] && ! diff -q docs/financial-apis-openapi.yaml /tmp/latest-spec.yaml > /dev/null 2>&1; then
          #   echo "drift=true" >> $GITHUB_OUTPUT
          # else
          #   echo "drift=false" >> $GITHUB_OUTPUT
          # fi
          echo "drift=false" >> $GITHUB_OUTPUT
          echo "Note: configure SPEC_URL above to enable automatic drift detection"

      - name: Open issue on drift
        if: steps.check.outputs.drift == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'API Drift detectado: financial-apis-openapi.yaml mudou',
              body: [
                '## Alteração detectada na spec OpenAPI da Conta Azul',
                '',
                'O arquivo `financial-apis-openapi.yaml` foi atualizado.',
                'Revisar manualmente e atualizar `src/Api/FinanceiroClient.php` se necessário.',
                '',
                'Referências:',
                '- `docs/financial-apis-openapi.yaml` — cópia local (desatualizada)',
                '- `src/Api/FinanceiroClient.php` — cliente que precisa ser atualizado',
              ].join('\n'),
              labels: ['api-drift'],
            })
